<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: system-ui;
        color: #334155;
        padding: 16px;
      }
      button,
      input {
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      button {
        cursor: pointer;
        background: #2563eb;
        color: white;
      }
      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      svg {
        width: 100%;
        height: 150px;
      }
      li {
        padding: 6px;
      }
      #status {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <h2>账本 / Ledger</h2>
    <p id="status"></p>
    <button id="init" disabled>创建账目表 / Initialize</button>
    <form id="entry">
      <input id="date" type="date" required /><input
        id="amount"
        type="number"
        step="0.01"
        placeholder="金额 / Amount"
        required
      /><input id="note" placeholder="备注 / Note" /><button type="button" disabled>
        记一笔 / Add
      </button>
    </form>
    <h3 id="total"></h3>
    <svg viewBox="0 0 600 150" role="img" aria-label="Monthly expenses">
      <circle id="point" r="4" fill="#2563eb" />
      <text id="chartLabel" x="20" y="148" font-size="12" fill="#64748b"></text>
      <polyline id="line" fill="none" stroke="#2563eb" stroke-width="3" />
    </svg>
    <ul id="rows"></ul>
    <script>
      let db,
        busy = false,
        refreshGeneration = 0;
      const el = (id) => document.getElementById(id);
      el('date').value = new Date().toISOString().slice(0, 10);
      function report(e) {
        console.error(e.message || String(e));
        el('status').textContent = e.message || String(e);
      }
      async function refresh() {
        const generation = ++refreshGeneration;
        const context = await tio.context.get();
        const writable = context.permissions.data === 'readWrite';
        const database = (await tio.databases.list()).find((d) => d.name === 'App Slice Ledger');
        if (generation !== refreshGeneration) return;
        db = database;
        el('init').hidden = !!db;
        el('init').disabled = !writable;
        el('entry').querySelector('button').disabled = !db || !writable || busy;
        el('status').textContent = writable
          ? '数据保存在页面表格 / Saved in the page database'
          : '请开启读写权限 / Enable read & write';
        if (!db) return;
        let rows = [],
          cursor;
        do {
          const result = await tio.databases.get(db.id).records.query({ limit: 1000, cursor });
          rows.push(...result.records);
          cursor = result.nextCursor;
        } while (cursor);
        if (generation !== refreshGeneration) return;
        el('rows').replaceChildren();
        let total = 0;
        const months = {};
        for (const row of rows) {
          const p = row.properties;
          total += Number(p.amount || 0);
          const month = (p.date?.start || '').slice(0, 7);
          months[month] = (months[month] || 0) + Number(p.amount || 0);
          const li = document.createElement('li');
          li.textContent = (p.date?.start || '') + ' · ' + p.amount + ' · ' + (p.note || '');
          el('rows').appendChild(li);
        }
        el('total').textContent = '合计 / Total: ' + total.toFixed(2);
        const values = Object.keys(months)
          .sort()
          .map((k) => months[k]);
        const max = Math.max(1, ...values.map(Math.abs));
        el('point').setAttribute('cx', '20');
        el('point').setAttribute('cy', String(130 - ((values[0] || 0) / max) * 110));
        el('point').style.display = values.length ? '' : 'none';
        el('chartLabel').textContent = Object.keys(months).sort().join(' · ');
        el('line').setAttribute(
          'points',
          values
            .map(
              (v, i) =>
                20 + (i * 560) / Math.max(1, values.length - 1) + ',' + (130 - (v / max) * 110),
            )
            .join(' '),
        );
      }
      el('init').onclick = async () => {
        el('init').disabled = true;
        try {
          await tio.databases.create({
            name: 'App Slice Ledger',
            fields: [
              { id: 'note', name: '备注 / Note', type: 'title' },
              { id: 'amount', name: '金额 / Amount', type: 'number' },
              { id: 'date', name: '日期 / Date', type: 'date' },
            ],
          });
          await refresh();
        } catch (e) {
          report(e);
          el('init').disabled = false;
        }
      };
      el('entry').querySelector('button').onclick = async () => {
        if (busy || !db || !el('entry').reportValidity()) return;
        busy = true;
        el('entry').querySelector('button').disabled = true;
        try {
          await tio.databases.get(db.id).records.create({
            note: el('note').value,
            amount: Number(el('amount').value),
            date: { start: el('date').value },
          });
          el('amount').value = '';
          await refresh();
        } catch (e) {
          report(e);
        } finally {
          busy = false;
          el('entry').querySelector('button').disabled = false;
        }
      };
      let timer;
      tio.subscribe(() => {
        clearTimeout(timer);
        timer = setTimeout(() => refresh().catch(report), 80);
      });
      refresh().catch(report);
    </script>
  </body>
</html>
