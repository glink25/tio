name: Bug report
description: Report a reproducible issue
title: '[Bug] '
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Do not include private workspace data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / Tio version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Storage mode
      options: [Device, Local Folder, GitHub]
