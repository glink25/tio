version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      blocknote:
        patterns: ['@blocknote/*']
      oxc:
        patterns: ['oxlint', 'oxlint-tsgolint', 'oxfmt']
      vite:
        patterns: ['vite', '@vitejs/*', 'vite-plugin-pwa', 'workbox-*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
