name: CI
on:
  push:
    branches: ['**', '!release-index']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/install-ci.mjs
      - name: Check release script syntax
        run: for script in apps/native/release/*.mjs apps/native/updates/*.mjs; do node --check "$script" || exit 1; done
      - run: corepack pnpm check
      - run: corepack pnpm --filter @tio/tests exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 7
